name: Deploy Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: cloudflare-staging
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - name: Check Cloudflare resource configuration
        shell: bash
        env:
          D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          FIREBASE_WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: test -n "$D1_DATABASE_ID" && test -n "$FIREBASE_WEB_API_KEY" && test -n "$FIREBASE_PROJECT_ID"
      - name: Build Worker
        run: npm run build
        env:
          CLOUDFLARE_WORKER_NAME: team401-scouting-staging
          CLOUDFLARE_CUSTOM_DOMAIN: staging.scout.team401.org
          CLOUDFLARE_D1_DATABASE_NAME: team401-scouting-staging
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ vars.CLOUDFLARE_R2_BUCKET_NAME }}
          FIREBASE_WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      - name: Apply D1 migrations
        run: npm run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Prepare Worker secrets
        shell: bash
        env:
          TBA_AUTH_KEY: ${{ secrets.TBA_AUTH_KEY }}
          FRC_EVENTS_USERNAME: ${{ secrets.FRC_EVENTS_USERNAME }}
          FRC_EVENTS_AUTH_KEY: ${{ secrets.FRC_EVENTS_AUTH_KEY }}
          TBA_WEBHOOK_SECRET: ${{ secrets.TBA_WEBHOOK_SECRET }}
          MATCH13_API_KEY: ${{ secrets.MATCH13_API_KEY }}
        run: |
          node -e "const secrets = {}; for (const key of ['TBA_AUTH_KEY','FRC_EVENTS_USERNAME','FRC_EVENTS_AUTH_KEY','TBA_WEBHOOK_SECRET','MATCH13_API_KEY']) if (process.env[key]) secrets[key] = process.env[key]; require('node:fs').writeFileSync(process.env.RUNNER_TEMP + '/worker-secrets.json', JSON.stringify(secrets))"
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/server/wrangler.json --secrets-file ${{ runner.temp }}/worker-secrets.json
