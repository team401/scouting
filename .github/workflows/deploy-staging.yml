name: Deploy Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: cloudflare-staging
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Check Cloudflare resource configuration
        shell: bash
        env:
          D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
        run: test -n "$D1_DATABASE_ID"
      - name: Build Worker
        run: npm run build
        env:
          CLOUDFLARE_WORKER_NAME: team401-scouting-staging
          CLOUDFLARE_CUSTOM_DOMAIN: staging.scout.team401.org
          CLOUDFLARE_D1_DATABASE_NAME: team401-scouting-staging
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ vars.CLOUDFLARE_R2_BUCKET_NAME }}
          BETTER_AUTH_URL: https://staging.scout.team401.org
      - name: Apply D1 migrations
        run: npm run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Prepare Worker secrets
        shell: bash
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          TBA_AUTH_KEY: ${{ secrets.TBA_AUTH_KEY }}
          TBA_WEBHOOK_SECRET: ${{ secrets.TBA_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          node -e "if (!process.env.BETTER_AUTH_SECRET || process.env.BETTER_AUTH_SECRET.length < 32) throw new Error('BETTER_AUTH_SECRET must contain at least 32 characters'); if (!process.env.RESEND_API_KEY) throw new Error('RESEND_API_KEY is required'); if (!process.env.EMAIL_FROM) throw new Error('EMAIL_FROM is required'); const secrets = { BETTER_AUTH_SECRET: process.env.BETTER_AUTH_SECRET, RESEND_API_KEY: process.env.RESEND_API_KEY, EMAIL_FROM: process.env.EMAIL_FROM }; if (process.env.TBA_AUTH_KEY) secrets.TBA_AUTH_KEY = process.env.TBA_AUTH_KEY; if (process.env.TBA_WEBHOOK_SECRET) secrets.TBA_WEBHOOK_SECRET = process.env.TBA_WEBHOOK_SECRET; require('node:fs').writeFileSync(process.env.RUNNER_TEMP + '/worker-secrets.json', JSON.stringify(secrets))"
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/server/wrangler.json --secrets-file ${{ runner.temp }}/worker-secrets.json
